<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的内网网页代理查看器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f6f8fa; color: #24292f; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 1px 3px rgba(27,31,35,0.12); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
        button { padding: 10px 20px; background-color: #2ea44f; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #2c974b; }
        #status { font-size: 14px; color: #57606a; margin-bottom: 10px; }
        #viewer { width: 100%; min-height: 600px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; padding: 15px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌐 内网跳板：外网网页查看器</h2>
    <div class="input-group">
        <input type="text" id="targetUrl" placeholder="请输入你想访问的完整外网网址，例如: https://ycombinator.com" value="https://example.com">
        <button onclick="loadWebPage()">立即访问</button>
    </div>
    <div id="status">就绪</div>
    <!-- 渲染容器 -->
    <div id="viewer">可在上方输入网址并点击访问...</div>
</div>

<script>
async function loadWebPage() {
    const urlInput = document.getElementById('targetUrl').value.trim();
    const statusDiv = document.getElementById('status');
    const viewerDiv = document.getElementById('viewer');

    if (!urlInput) {
        alert('请输入网址！');
        return;
    }

    statusDiv.innerText = "🔄 正在通过公网代理下载网页中，请稍候...";
    viewerDiv.innerText = "加载中...";

    try {
        // 使用免费、开源且稳定的全跨域 allorigins 代理 API
        // 它会代替我们在公网下载网页，并附带跨域头回传给浏览器
        const proxyApi = `https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`;
        
        const response = await fetch(proxyApi);
        if (!response.ok) throw new Error('网络代理响应异常');
        
        const data = await response.json();
        
        statusDiv.innerText = "✅ 网页加载成功！已绕过限制。";
        
        // 将获取到的外网网页 HTML 代码直接注入到页面中展示
        viewerDiv.innerHTML = data.contents;
        
    } catch (error) {
        statusDiv.innerText = "❌ 加载失败。";
        viewerDiv.innerHTML = `<p style="color:red;">错误原因: ${error.message}<br><br>提示：某些有高强度防火墙或需要登录授权的网站（如 Google/Facebook）可能会拦截此类代理请求。</p>`;
    }
}
</script>

</body>
</html>
